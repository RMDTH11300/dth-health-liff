<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DTH Health</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #1f2937;
    }

    .wrap {
      max-width: 520px;
      margin: auto;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 28px 22px;
      margin-top: 38px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    .logo {
      font-size: 58px;
    }

    h1 {
      margin: 8px 0 4px;
    }

    .sub {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .status {
      padding: 14px;
      border-radius: 14px;
      background: #f3f4f6;
      color: #6b7280;
    }

    .success {
      background: #ecfdf3;
      color: #15803d;
    }

    .error {
      background: #fff1f2;
      color: #be123c;
    }

    #profile {
      display: none;
    }

    #avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      margin: 18px auto 8px;
      border: 4px solid #ecfdf3;
    }

    #name {
      font-size: 22px;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="logo">🏃‍♀️</div>

    <h1>DTH Health</h1>

    <div class="sub">
      Employee Health & Fitness
    </div>

    <div id="status" class="status">
      กำลังเชื่อมต่อ LINE...
    </div>

    <div id="profile">

      <img id="avatar">

      <div id="name"></div>

      <p>
        เชื่อมต่อ LINE สำเร็จ<br>
        พร้อมเข้าสู่ระบบ DTH Health
      </p>

    </div>

  </div>
</div>


<script>

const LIFF_ID = "2011115304-nt4j971c";

async function startApp() {

  const status = document.getElementById("status");

  try {

    await liff.init({
      liffId: LIFF_ID,
      withLoginOnExternalBrowser: true
    });

    if (!liff.isLoggedIn()) {

      liff.login({
        redirectUri: window.location.href
      });

      return;
    }

    const profile = await liff.getProfile();

    status.textContent =
      "✅ เชื่อมต่อ LINE สำเร็จ";

    status.className =
      "status success";

    document.getElementById("profile")
      .style.display = "block";

    document.getElementById("name")
      .textContent =
      profile.displayName || "ผู้ใช้งาน";

    const avatar =
      document.getElementById("avatar");

    if (profile.pictureUrl) {
      avatar.src = profile.pictureUrl;
    } else {
      avatar.style.display = "none";
    }

  } catch (err) {

    status.textContent =
      "เชื่อมต่อ LINE ไม่สำเร็จ: " +
      err.message;

    status.className =
      "status error";

  }
}

startApp();

</script>

</body>
</html>
